services:
  - type: web
    name: titan-front
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
    # SPA: cualquier ruta sirve index.html (el router de Angular decide qué mostrar).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # El service worker y su manifiesto no se cachean: así las actualizaciones llegan.
      - path: /ngsw-worker.js
        name: Cache-Control
        value: no-cache
      - path: /ngsw.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
